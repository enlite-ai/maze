# pyproject.toml for maze
[build-system]
requires = ['setuptools<81', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'maze-rl'
version = '0.2.4'
description = 'MazeRL is a development framework for building applied reinforcement learning systems, addressing real-world decision problems. It supports the complete development life cycle of RL applications, ranging from simulation engineering up to agent development, training and deployment.'
readme = { file = 'README.md', content-type = 'text/markdown' }
authors = [{ name = 'enliteAI GmbH', email = 'office@enlite.ai' }]
urls = { Homepage = 'https://enlite.ai', Repository = 'https://github.com/enlite-ai/maze' }
requires-python = '>=3.10, <3.14'
license = 'LicenseRef-Proprietary'
license-files = ['LICENSE.txt']
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    'Development Status :: 3 - Alpha',

    # Indicate who your project is intended for
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Education',

    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Topic :: Software Development :: Libraries :: Python Modules',

    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',

]
keywords = [
    'applied-reinforcement-learning',
    'reinforcement-learning',
    'machine-learning',
    'deep-learning',
    'distributed',
    'optimization'
]
dependencies = [
    # setuptools above 81 are incompatible with tensorboard 2.20
    'setuptools<81',
    'tensorboard',
    'pyyaml',
    'requests',
    'pillow',

    'hydra-core',
    'hydra-optuna-sweeper',

    'gymnasium',

    'pandas',
    'networkx',
    'matplotlib',
    'seaborn',
    'tqdm',
    'imageio',

    # train
    'redis',
    'cloudpickle',

    # testing
    'pytest',
    'pytest-timeout',
    'pytest-redis'
]

[project.optional-dependencies]
testing = [
    'pytest',
    'pytest-redis'
]

[project.scripts]
maze-run = 'maze.maze_cli:maze_run'

[tool.setuptools.packages.find]
# Start package search from the current directory
where = ['.']
# Use patterns
include = ['maze', 'maze.*', 'hydra_plugins']
# Enable namespace discovery (similar to find_namespace_packages)
namespaces = true

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
markers = [
    'longrun: mark test as longrun.'
]
log_cli = true
log_cli_level = 'INFO'
timeout = 0

[tool.mypy]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 120

[tool.ruff]
line-length = 120
force-exclude = true

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'UP', 'B', 'ARG', 'SLF']

ignore = ['E203']
per-file-ignores = { '**/__init__.py' = ['F401'] }

[tool.ruff.lint.pylint]
max-branches = 15
max-args = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
section-order = ['future', 'standard-library', 'first-party', 'third-party', 'local-folder']
required-imports = ['from __future__ import annotations']

[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true

