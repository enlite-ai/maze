# Default configuration for policy rollouts.

defaults:
  - _self_
  - runner: parallel
  - env: gym_env
  - wrappers: no_wrappers
  - policy: random_policy
  - model: flatten_concat
  - configuration: ~

  # Configuration specializations (mainly for test scenarios, to keep tests simple and fast)
  - optional runner_configuration: ${runner}-${configuration}
  - optional env_configuration: ${env}-${configuration}

# Hydra is by default configured to create a fresh output directory for each run.
# However, to ensure model states, normalization stats and else are loaded from expected
# locations, we will change the dir back to the original working dir for the initialization
# (and then change it back so that all later script output lands in the hydra output dir as expected)
input_dir: ""

# Maze seeding. If no seeds are given they are generated and the seeds used are documented in
# the hydra_config.yaml file in order to reproduce experiments.
seeding:
  # Base seed for creating env seeds
  env_base_seed: ~
  # Base seed for creating agent seeds
  agent_base_seed: ~
  # Specify whether to set the cudnn determinism flag, this will ensure guaranty when working on the gpu, however some
  # torch modules will raise runtime errors, and the processing speed will be decreased.
  cudnn_determinism_flag: false
  # Optionally specify an explicit sequence of seeds used for seeding the environment (w.r.t. each episode).
  explicit_env_seeds: ~
  # Optionally specify an explicit sequence of seeds used for seeding the evaluation environment (w.r.t. each episode).
  explicit_env_eval_seeds: ~
  # Optionally specify an explicit sequence of seeds used for seeding the agent (w.r.t. each episode).
  explicit_agent_seeds: ~
  # Specify whether the explicit sequence of seeds should be shuffled (based on the env/agent _base_seed).
  shuffle_seeds: false

# If provided, the config of the model and policy config from the input_dir will be used.
# Optionally the environment or/and the wrappers config can be used from the input_dir.
# Example for using the environment config from the input_dir:
#use_input_dir_config:
#  use_input_dir_model: True
#  use_input_dir_env: True
#  use_input_dir_wrappers: False
use_input_dir_config: ~

# Base directory where to output logs
# Uses the HOME environment variable to ensure the path is absolute and user-specific
log_base_dir: ${oc.env:HOME}/maze-runs/rollout

# Configuration for Hydra
hydra:
  job:
    # Preserve pre-1.2 behavior of changing the working directory to the job's output directory at runtime. Without
    # this, relative paths in the code will resolve to the original working directory instead of the job's output
    # directory. See https://hydra.cc/docs/1.2/upgrades/1.1_to_1.2/changes_to_job_working_dir/
    chdir: true
  run:
    # Output directory for local rollouts. The directory name is composed of the active config choices (env, runner) and
    # a microsecond-precision timestamp (%f) to make it extremely unlikely that simultaneously started runs accidentally
    # write to the same output directory.
    dir: ${log_base_dir}/${hydra:runtime.choices.env}-${hydra:runtime.choices.runner}/${now:%Y-%m-%d_%H-%M-%f}
  sweep:
    # Output directory for rollouts launched through a launcher (e.g. kubernetes-based)
    # Uses a shared sweep directory with a timestamped subdirectory
    dir: ${log_base_dir}/sweep/${now:%Y-%m-%d_%H-%M-%f}